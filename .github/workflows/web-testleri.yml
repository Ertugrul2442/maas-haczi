name: Web sürümü testleri

# NE YAPAR: tarayıcı sürümünün hesap motorunu sınar ve — asıl önemlisi —
# masaüstü Python sürümüyle BİREBİR aynı sonucu verdiğini her itişte ölçer.
#
# NEDEN ÖNEMLİ: web sürümü Python'un round() ve Decimal'inin JS karşılığını
# elle yazmak zorunda kaldı (JS'te ikisi de yok). Bu tür bir port sessizce
# ayrışır: masaüstü testleri geçmeye devam eder, web kuruş kaydırır, kimse
# fark etmez. Ölçüldü: Math.round 47.310 kombinasyonun 864'ünde yanılıyordu
# ve karardaki gerçek dosyada bile 3.509,44 diyordu (doğrusu 3.509,43).
#
# ⚠ Buradaki testlerin HİÇBİRİ SGK dökümü istemiyor, o yüzden depoda kişisel
# veri olmadan koşabiliyorlar. Python testlerinden üçü (test_hesap,
# test_pekten_net, test_ilk_ay) döküm istediği için hâlâ CI'da koşamıyor.

on:
  push:
    paths:
      - "web/**"
      - "net_maas.py"
      - "hesap.py"
      - "disa_aktar.py"
      - "ayarlar.json"
      - ".github/workflows/web-testleri.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # xlrd: hesap.py .xls okumak icin import ediyor.
      # xlwt: dokum kiyasinin sentetik .xls dosyalarini yazmasi icin.
      # python-docx: Word kiyasinin IKI ciktiyi da acip okumasi icin.
      - name: Python paketleri
        run: pip install --quiet xlrd xlwt python-docx

      # 1) Yuvarlama: Python'un round(x, 2)'sinin taklidi doğru mu?
      - name: Yuvarlama testi
        run: node web/test_yuvarla.js

      # 2) Net ücret: 60/60 ay resmî net asgari ücreti veriyor mu?
      - name: Net ücret testi (JS)
        run: node web/test_net_maas.js

      # 3) Aynı test Python tarafında da geçiyor mu?
      - name: Net ücret testi (Python)
        run: python test_net_maas.py

      # 4) İki testin ÇIKTISI harfi harfine aynı mı? Bu, "ikisi de geçti"den
      #    daha güçlü: her satırdaki rakam da tutmalı.
      - name: İki sürümün çıktısı aynı mı
        run: |
          python test_net_maas.py  > /tmp/py.txt
          node web/test_net_maas.js > /tmp/js.txt
          diff /tmp/py.txt /tmp/js.txt && echo "Çıktılar birebir aynı."

      # 5) En güçlü ölçüt: 28.000+ senaryoda Python'un Decimal sonucuyla
      #    JS'in sonucu değer değer kıyaslanıyor.
      - name: Python'a karşı tarama (28.000+ senaryo)
        run: |
          python web/kiyas_net_maas.py > web/kiyas_veri.json
          node web/kiyas_net_maas.js web/kiyas_veri.json

      # 6) Hesap motoru: sentetik (kişisel veri içermeyen) dökümler üzerinde
      #    hesap.py ile hesap.js aynı sonucu mu veriyor? Tutar, uyarı metinleri,
      #    tutanak paragrafı ve tablo satırları alan alan kıyaslanıyor.
      #    ⚠ Gerçek SGK dökümüyle koşan kıyas burada YOK: döküm kişisel veri,
      #    depoda durmuyor. O kıyas yerelde koşuluyor (--sentetik'siz).
      - name: Hesap motoru Python'a karşı (sentetik dökümler)
        run: |
          python web/kiyas_hesap.py --sentetik > web/kiyas_sentetik.json
          node web/kiyas_hesap.js web/kiyas_sentetik.json

      # 7) Dosya okuma: AYNI .xls'i xlrd (masaüstü) ve SheetJS (tarayıcı)
      #    aynı mı okuyor? Sentetik dökümler xlwt ile o an üretiliyor —
      #    kişisel veri yok, CI'da koşabiliyorlar.
      #    ⚠ Ölçüldü (10.09.2026): gerçek lll.xls'te BÜTÜN hücreler metin,
      #    yani "sayısal hücre" ve "biçimli sayı" yolları gerçek dosyada HİÇ
      #    çalışmıyor. Sentetikler tam da o yolları zorluyor.
      - name: Döküm okuma xlrd'ye karşı (sentetik .xls)
        run: |
          python web/kiyas_dokum.py --sentetik > web/kiyas_dokum_veri.json
          node web/kiyas_dokum.js web/kiyas_dokum_veri.json

      # 8) Word çıktısı: python-docx ile JSZip aynı belgeyi mi üretiyor?
      #    Paragraf paragraf, hücre hücre — metin, hiza, punto, kalınlık,
      #    girinti, sayfa kırılması, sayfa ölçüsü, satır aralığı.
      #    ⚠ Satır aralığı ve sayfa ölçüsü BOŞUNA kıyaslanmıyor: PUNTO_KADEME
      #    eşikleri Word'e saydırılarak, python-docx'in LETTER + 1,15 satır
      #    aralıklı şablonuyla ölçüldü. JS iskeleti A4 üretirse tutanak
      #    SESSİZCE 2. sayfaya taşar.
      - name: Word çıktısı python-docx'e karşı
        run: python web/kiyas_word.py

      # 8b) Excel çıktısı: openpyxl ile JSZip aynı tabloyu mu üretiyor?
      #     Hücre hücre — değer, sayı biçimi, kalınlık, punto, DOLGU RENGİ,
      #     çerçevenin dört kenarı, hiza; ayrıca birleştirmeler, sütun
      #     genişlikleri ve dondurulmuş bölme.
      #     ⚠ Renkler burada BİÇİM DEĞİL BİLGİ: mavi = net SGK kazancından
      #     hesaplandı, turuncu = kazanç asgarinin dışında. SheetJS'in
      #     ücretsiz sürümü stil YAZAMADIĞI için (ölçüldü) bu dosya JSZip ile
      #     düz OOXML yazıyor; kıyas onu kilitliyor.
      - name: Excel çıktısı openpyxl'e karşı
        run: |
          pip install --quiet openpyxl
          python web/kiyas_excel.py

      # 9) Dosyalar tarayıcıda da yükleniyor mu? (require/module olmadan)
      #    "Node'da çalışıyor" ile "tarayıcıda çalışıyor" ayrı sorular.
      - name: Tarayıcı gibi yükleniyor mu
        run: node web/tarayici_kontrol.js

      # 10) ayarlar.json ile onun WEB KOPYASI (web/ayarlar_veri.js) aynı mı?
      #     Web sürümü ayarları fetch edemiyor — "file://" altında tarayıcı
      #     hem fetch'i hem XHR'ı engelliyor (10.09.2026'da Chromium ile
      #     ölçüldü). O yüzden ayarların gömülü bir kopyası var. İki kopya
      #     demek sessizce ayrışabilir demek: yeni asgari ücret ayarlar.json'a
      #     girer, tarayıcı sürümü ESKİ rakamla hesaplamaya devam eder ve
      #     kimse fark etmez. Bu adım tam da onu kırmızı yakıyor.
      - name: Asgari ücret tablosu web kopyasıyla aynı mı
        run: node web/ayarlar_uret.js --kontrol

      # 11) ARAYÜZ: sayfa gerçek bir tarayıcıda, gerçekten "file://" ile
      #     açılıp masaüstü arayüzle AYNI şeyi mi gösteriyor?
      #
      #     Motor kıyasları (5-8) "aynı girdiye aynı sayı" diyor; bu ise
      #     "motor doğru bağlanmış mı" diyor. Yanlış sırayla parametre
      #     geçmek, satırı yanlış renge boyamak, uyarıyı hiç yazmamak —
      #     hiçbirini motor kıyası yakalamaz. Bu projede tam bu sınıfta üç
      #     hata yaşandı ve üçü de ancak çıktı GÖZLE okunarak bulundu.
      #
      #     Kıyas ekranın yanı sıra inen .docx'in İÇİNİ de okuyor: "bir dosya
      #     indi" ile "doğru dosya indi" ayrı sorular.
      #
      #     ⚠ file:// bilerek: program adliyede flaştan da açılabilmeli.
      #     Sunucudan servis edilseydi kıyas yeşil yanar, flaşta açılmazdı.
      - name: Playwright + Chromium kur
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Arayüz masaüstüne karşı (sentetik dökümler)
        run: |
          python web/kiyas_arayuz.py --sentetik > web/kiyas_arayuz_veri.json
          node web/kiyas_arayuz.js web/kiyas_arayuz_veri.json
